[project]
name = "loseit-mcp"
version = "0.6.0"
description = "MCP server for logging food to Lose It!"
readme = "README.md"
license = "0BSD"
license-files = ["LICENSE"]
requires-python = ">=3.12"
classifiers = [
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]
dependencies = [
    "lose-it",
    "mcp>=1.2.0",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.1",
    "cryptography>=49.0.0",
]

[project.scripts]
loseit-mcp = "loseit_mcp.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loseit_mcp"]

[tool.uv.sources]
lose-it = { git = "https://github.com/phitoduck/lose-it" }

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.6",
    "trio>=0.33.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100


